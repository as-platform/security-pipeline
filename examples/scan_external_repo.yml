name: security-external

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/name of a public repository to scan
        type: string
        required: true
      ref:
        description: Branch, tag or SHA, empty means the default branch
        type: string
        default: ""

permissions:
  contents: read

jobs:
  security:
    uses: as-platform/security-pipeline/.github/workflows/security-pipeline.yml@main
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      artifact-name: security-pipeline-external
    secrets:
      zot-user: ${{ secrets.ZOT_USER }}
      zot-password: ${{ secrets.ZOT_PASSWORD }}
