name: checkov
description: Scan the workspace for IaC misconfigurations with checkov in report mode and write the result for the quality gate

inputs:
  container-id:
    description: Id of the buildah container from common/image, empty when the image phase failed
    required: true

runs:
  using: composite
  steps:
    - name: checkov
      shell: bash
      env:
        CONTAINER: ${{ inputs.container-id }}
      run: |
        set -euo pipefail

        sp_dir="${SP_DIR:?SP_DIR is not set, common/prepare did not run}"
        raw="${sp_dir}/checkov.raw.json"
        report="${sp_dir}/reports/checkov.json"
        stderr="${sp_dir}/checkov.stderr"
        result="${sp_dir}/results/checkov.json"
        rm -f "$raw" "$report" "$stderr" "$result"

        status=error
        rc=-1
        findings=0
        start=$SECONDS
        if [ -z "$CONTAINER" ]; then
          echo "::error::checkov did not run: there is no container, the image phase failed"
        else
          rc=0
          buildah run --user 0:0 -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" -v "${sp_dir}:${sp_dir}" --workingdir "$GITHUB_WORKSPACE" "$CONTAINER" -- \
            checkov --skip-download --skip-framework secrets --directory "$GITHUB_WORKSPACE" --output json --soft-fail > "$raw" 2> "$stderr" || rc=$?
          if [ "$rc" -eq 0 ] \
            && jq -e 'type == "array" or type == "object"' "$raw" > /dev/null 2>&1 \
            && jq 'del(.. | .code_block?, (.check_result? | .entity?))' "$raw" > "$report"; then
            status=ok
            findings=$(jq '[(if type == "array" then .[] else . end) | (.summary // .) | .failed // 0] | add // 0' "$report")
          else
            rm -f "$report"
            tail -n 20 "$stderr" || true
            echo "::error::checkov failed: exit code ${rc}, or the report is missing, is not JSON or could not be sanitized"
          fi
        fi
        rm -f "$raw"
        elapsed=$((SECONDS - start))

        jq -n --arg status "$status" --argjson rc "$rc" --argjson findings "$findings" \
          '{tool: "checkov", practice: "SAST/IAC", status: $status, rc: $rc, findings: $findings, gated: $findings, report: "checkov.json"}' > "$result"
        echo "checkov: status=${status} rc=${rc} findings=${findings} scan_seconds=${elapsed} memory_peak_bytes=$(cat /sys/fs/cgroup/memory.peak 2> /dev/null || echo n/a)"
