name: gitleaks
description: Scan the workspace for secrets with gitleaks in report mode and write the result for the quality gate

inputs:
  container-id:
    description: Id of the buildah container from common/image, empty when the image phase failed
    required: true

runs:
  using: composite
  steps:
    - name: gitleaks
      shell: bash
      env:
        CONTAINER: ${{ inputs.container-id }}
      run: |
        set -euo pipefail

        sp_dir="${SP_DIR:?SP_DIR is not set, common/prepare did not run}"
        report="${sp_dir}/reports/gitleaks.json"
        result="${sp_dir}/results/gitleaks.json"
        rm -f "$report" "$result"

        status=error
        rc=-1
        findings=0
        start=$SECONDS
        if [ -z "$CONTAINER" ]; then
          echo "::error::gitleaks did not run: there is no container, the image phase failed"
        else
          rc=0
          buildah run --user 0:0 -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" -v "${sp_dir}:${sp_dir}" --workingdir "$GITHUB_WORKSPACE" "$CONTAINER" -- \
            gitleaks detect --no-banner --no-git --redact --source "$GITHUB_WORKSPACE" --report-format json --report-path "$report" --exit-code 0 || rc=$?
          if [ "$rc" -eq 0 ] && jq -e 'type == "array"' "$report" > /dev/null 2>&1; then
            status=ok
            findings=$(jq 'length' "$report")
          else
            echo "::error::gitleaks failed: exit code ${rc}, or the report is missing or is not a JSON array"
          fi
        fi
        elapsed=$((SECONDS - start))

        jq -n --arg status "$status" --argjson rc "$rc" --argjson findings "$findings" \
          '{tool: "gitleaks", practice: "SAST/SECRETS", status: $status, rc: $rc, findings: $findings, gated: $findings, report: "gitleaks.json"}' > "$result"
        echo "gitleaks: status=${status} rc=${rc} findings=${findings} scan_seconds=${elapsed} memory_peak_bytes=$(cat /sys/fs/cgroup/memory.peak 2> /dev/null || echo n/a)"
